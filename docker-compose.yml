services:
  db:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  web:
    build: .
    container_name: ecommerce-web
    command: bundle exec rails server -b 0.0.0.0
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - kafka

  consumer:
    build: .
    container_name: ecommerce-payment-consumer
    command: bundle exec rails runner "RdkafkaConsumer.new.start"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - kafka

  notification_consumer:
    build: .
    container_name: ecommerce-notification-consumer
    command: bundle exec rails runner "NotificationConsumer.new.start"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - kafka

  notification_dlq_consumer:
    build: .
    container_name: ecommerce-notification-dlq-consumer
    command: bundle exec rails runner "NotificationDlqConsumer.new.start"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - db
      - kafka

volumes:
  mysql_data:
